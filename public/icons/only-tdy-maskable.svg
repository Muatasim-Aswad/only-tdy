<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="only-tdy">
  <title>only-tdy</title>
  <!--
    The maskable variant: the same mark, bled to the edges so a launcher can
    crop it to any silhouette, with every mark inside the 80% safe circle.
  -->
  <rect width="64" height="64" fill="#315E65"/>
  <circle cx="23" cy="32" r="9" fill="none" stroke="#F4F6F5" stroke-width="5"/>
  <rect x="38" y="29.5" width="17" height="5" rx="2.5" fill="#F4F6F5"/>
</svg>
