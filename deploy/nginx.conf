# only-tdy static server.
#
# The reverse proxy mounts this container at /only-tdy and strips that prefix
# before proxying, so nginx always receives paths at its own root. The browser
# keeps the /only-tdy/ base, which is why the app shell — not nginx —
# canonicalizes the exact /only-tdy pathname. Never add a /only-tdy location or
# redirect here: behind the proxy it would loop.
#
# Every writable path lives under /tmp so the container root filesystem can stay
# read-only.

worker_processes  1;

error_log  /var/log/nginx/error.log  notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path  /tmp/client_temp;
    proxy_temp_path        /tmp/proxy_temp;
    fastcgi_temp_path      /tmp/fastcgi_temp;
    uwsgi_temp_path        /tmp/uwsgi_temp;
    scgi_temp_path         /tmp/scgi_temp;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    server_tokens      off;
    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/css
                      text/plain
                      application/javascript
                      application/json
                      application/manifest+json
                      image/svg+xml;

    server {
        listen       8080;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # Unauthenticated liveness probe for the container health check and the
        # deployment smoke tests.
        location = /healthz {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            return 200 "ok\n";
        }

        # Build output carries a content hash, so it can be pinned for a year.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Icon filenames are stable, so they revalidate instead of pinning.
        location /icons/ {
            add_header Cache-Control "public, max-age=3600" always;
            try_files $uri =404;
        }

        # The worker and the manifest decide what the installed app becomes, so
        # they must never be served stale.
        location = /sw.js {
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        location = /manifest.webmanifest {
            default_type application/manifest+json;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        # The deployed build's identity: what the version page compares against.
        location = /version.json {
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }

        # Source maps are not shipped; answer honestly instead of falling back to
        # the shell.
        location ~ \.map$ {
            access_log off;
            return 404;
        }

        # Single-page fallback. Both /only-tdy and /only-tdy/ arrive here as / once
        # the proxy has stripped the mount prefix.
        location / {
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
